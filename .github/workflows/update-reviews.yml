name: Update Google Reviews

# Scrapes the latest Google reviews, then builds and deploys so the live site
# picks them up. Runs automatically every Monday, and can also be triggered
# manually from the Actions tab.
#
# The scrape rewrites public/reviews.json, src/data/reviews.js and the
# aggregateRating in index.html — none of them committed, all three consumed by
# the build that follows. It has to stay BEFORE the Build step: the hero badge
# and the JSON-LD are baked in at build time, and only the JSON is fetched at
# runtime.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # every Monday 04:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Fetch reviews from Google Maps
        run: npm run fetch-reviews

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
