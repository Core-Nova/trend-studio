name: Update Google Reviews

# Scrapes the latest Google reviews, then builds and deploys so the live site
# picks them up. Runs automatically every Monday, and can also be triggered
# manually from the Actions tab.
#
# The scrape rewrites public/reviews.json, src/data/reviews.js and the
# aggregateRating in index.html — none of them committed, all three consumed by
# the build that follows. It has to stay BEFORE the Build step: the hero badge
# and the JSON-LD are baked in at build time, and only the JSON is fetched at
# runtime.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1' # every Monday 04:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Full history, so the sitemap's <lastmod> dates come from each route's
        # own last commit instead of the tip commit (see deploy.yml).
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Fetch reviews from Google Maps
        run: npm run fetch-reviews

      # Same env as deploy.yml, so a Monday deploy builds the same site as a
      # push deploy.
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # A separate job, as in deploy.yml: it starts only once the build job — and
  # its artifact upload — has finished. With upload and deploy in one job, the
  # 23 Nov 2026 run's deploy asked for the "github-pages" artifact moments after
  # uploading it and was told it did not exist, so that week's reviews never
  # went live.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
