name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      # Same scrape as update-reviews.yml. Without it a push deploy ships the
      # committed review snapshot and silently undoes the last Monday refresh
      # (Nov 2026: the live site fell back from the scraped count to 54 hours
      # after the scheduled run). Best-effort: if Google Maps can't be read,
      # the build uses the committed snapshot and the deploy still goes out.
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        continue-on-error: true

      - name: Fetch reviews from Google Maps
        run: npm run fetch-reviews
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Optional overrides — both have safe hardcoded defaults in the code
          # (SITE.backendUrl in src/lib/constants.js, G-MEJCZTPTG5 in
          # src/lib/analytics.js), so the site builds correctly with or without
          # these secrets. Set them only to point CI at a different backend/GA
          # property (e.g. staging). An unset secret resolves to empty → default.
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
